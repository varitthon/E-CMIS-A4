<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คิวงานหลัก | E-CMIS ระบบกฎหมายในทางคดี</title>
<link rel="icon" type="image/png" href="pacc_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<link href="assets/ecmis-app.css" rel="stylesheet">
<link href="assets/ecmis-activity10.css" rel="stylesheet">
</head>
<body>

<main class="app-main">

  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-inbox me-2"></i>งานกฎหมายในทางคดีที่รอฉันดำเนินการ</h1>
      <div class="sub">รายการสำนวนคดีชั้นอัยการ, คำร้อง/คำอุทธรณ์เปิดเผยข้อมูล และคดีปกครอง พร้อมระบบติดตามกรอบเวลา Real-time</div>
    </div>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <button class="btn btn-xs btn-outline-secondary" onclick="resetDemoData()"><i class="fa-solid fa-rotate me-1"></i>รีเซ็ตข้อมูลตัวอย่าง</button>
      <button type="button" class="btn btn-navy btn-sm" onclick="openNewCaseModal()"><i class="fa-solid fa-plus me-1"></i>ลงทะเบียนเรื่องใหม่</button>
    </div>
  </div>

  <!-- KPI Row -->
  <div class="row g-3 mb-4" id="kpiContainer">
    <!-- Rendered dynamically -->
  </div>

  <!-- Filter & Search Controls -->
  <div class="card card-ecmis mb-3">
    <div class="card-body p-3">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="ค้นหาเลขที่สำนวน / ชื่อเรื่อง / นิติกร..." onkeyup="currentPage = 1; renderTable()">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="categoryFilter" onchange="renderTable()">
            <option value="all">ทุกหมวดหมู่งานกฎหมาย</option>
            <option value="10.1">คดีชั้นอัยการ (ความเห็นแย้ง)</option>
            <option value="10.2">คำร้อง/อุทธรณ์ข้อมูลข่าวสาร (รวม)</option>
            <option value="10.2.1">ขอเปิดเผยข้อมูลข่าวสาร</option>
            <option value="10.2.2">อุทธรณ์การไม่เปิดเผยข้อมูล</option>
            <option value="10.3">คดีปกครอง (ศาลปกครอง)</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="slaFilter" onchange="renderTable()">
            <option value="all">ทุกสถานะกรอบเวลา</option>
            <option value="normal">ปกติ (ชิลล์ในกรอบเวลา)</option>
            <option value="warning">เตือนส้ม (เหลือ ≤ 15 วัน)</option>
            <option value="danger">เตือนแดง (เหลือ ≤ 5 วัน)</option>
          </select>
        </div>
        <div class="col-md-2 text-end d-flex align-items-center justify-content-end gap-2">
          <button type="button" class="btn btn-xs btn-outline-secondary py-1 px-2" onclick="clearFilters()" title="ล้างตัวกรองทั้งหมด">
            <i class="fa-solid fa-filter-circle-xmark me-1"></i>ล้างกรอง
          </button>
          <span class="badge bg-navy px-3 py-2 fs-6 rounded-pill" id="caseCountBadge">0 เรื่อง</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Table Work Queue -->
  <div class="row g-3">
    <div class="col-12">
      <div class="card card-ecmis mb-3">
        <div class="card-header d-flex align-items-center justify-content-between">
          <span><i class="fa-solid fa-list-check me-2"></i>คิวรายการงานกฎหมายและสำนวนคดีปัจจุบัน</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover tbl-ecmis mb-0">
              <colgroup>
                <col style="width:40px">
                <col style="width:160px">
                <col style="width:150px">
                <col>
                <col style="width:150px">
                <col style="width:140px">
                <col style="width:160px">
              </colgroup>
              <thead>
                <tr>
                  <th><input type="checkbox" id="chkSelectAll" class="form-check-input" onchange="toggleSelectAll(this)" title="เลือกทั้งหมด"></th>
                  <th>เลขที่สำนวน/คำร้อง</th>
                  <th>หมวดหมู่อื่น</th>
                  <th>เรื่อง / รายละเอียด</th>
                  <th>สถานะขั้นตอน</th>
                  <th>กรอบเวลา</th>
                  <th class="text-end">ดำเนินการ</th>
                </tr>
              </thead>
              <tbody id="caseTableBody">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
          
          <!-- Bulk actions & Pagination footer -->
          <div class="px-3 py-2 border-top bg-light d-flex align-items-center justify-content-between flex-wrap gap-3" id="tableFooter">
            <div class="d-flex align-items-center gap-2">
              <span class="small text-muted" id="bulkSelectCount">เลือกแล้ว 0 รายการ</span>
              <div id="bulkButtons" class="d-none d-flex align-items-center gap-2">
                <button type="button" class="btn btn-xs btn-navy py-1 px-2" style="font-size:0.78rem" onclick="executeBulkApprove()">
                  <i class="fa-solid fa-check-double me-1"></i>เสนออนุมัติผู้บังคับบัญชาเป็นชุด (Bulk Approve)
                </button>
                <button type="button" class="btn btn-xs btn-outline-primary py-1 px-2" style="font-size:0.78rem" onclick="executeBulkReassign()">
                  <i class="fa-solid fa-user-gear me-1"></i>มอบหมายนิติกรใหม่ (Bulk Assign)
                </button>
                <button type="button" class="btn btn-xs btn-outline-secondary py-1 px-2" style="font-size:0.78rem" onclick="executeBulkExport()">
                  <i class="fa-solid fa-file-excel me-1"></i>ส่งออกรายงานสรุป (Bulk Export)
                </button>
              </div>
            </div>

            <!-- Pagination Controls -->
            <div class="ms-auto" id="paginationWrapper">
              <nav aria-label="Table navigation">
                <ul class="pagination pagination-sm mb-0" id="paginationControls">
                  <!-- Rendered dynamically -->
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/ecmis-app.js"></script>
<script src="assets/ecmis-activity10.js"></script>
<script>
  ECMIS.renderShell('01-work-inbox.html');

  document.addEventListener("DOMContentLoaded", function() {
    renderKPI();
    renderTable();
  });

  let activeKpiFilter = null;

  function renderKPI() {
    const cases = Activity10.getCases();
    const countTotal = cases.length;
    const count101 = cases.filter(c => c.category === '10.1').length;
    const count102 = cases.filter(c => c.category.startsWith('10.2')).length;
    const count103 = cases.filter(c => c.category === '10.3').length;
    const countWarn = cases.filter(c => c.slaDaysRemaining <= 5).length;

    document.getElementById("kpiContainer").innerHTML = `
      <div class="col-6 col-lg">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive" style="min-height:92px;" data-kpi="all" onclick="filterByKpi('all')" title="คลิกเพื่อดูคิวงานทั้งหมด">
          <div class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-dark" style="line-height:1.1">${countTotal}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">คิวงานทั้งหมด</small>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive" style="min-height:92px;" data-kpi="10.1" onclick="filterByKpi('10.1')" title="คลิกเพื่อกรองคดีศาลอาญาทุจริตและประพฤติมิชอบ">
          <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-scale-balanced"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-primary" style="line-height:1.1">${count101}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">คดีศาลอาญาทุจริตและประพฤติมิชอบ</small>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive" style="min-height:92px;" data-kpi="10.2" onclick="filterByKpi('10.2')" title="คลิกเพื่อกรองคำร้องขอเปิดเผยข้อมูล">
          <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-envelope-open-text"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-warning" style="line-height:1.1">${count102}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">คำร้องขอเปิดเผยข้อมูล</small>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive" style="min-height:92px;" data-kpi="10.3" onclick="filterByKpi('10.3')" title="คลิกเพื่อกรองคดีศาลปกครอง">
          <div class="rounded-circle bg-info text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-landmark"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-info" style="line-height:1.1">${count103}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">คดีศาลปกครอง</small>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive" style="min-height:92px;" data-kpi="danger" onclick="filterByKpi('danger')" title="คลิกเพื่อกรองเตือนเหลือ ≤ 5 วัน">
          <div class="rounded-circle bg-danger text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-clock"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-danger" style="line-height:1.1">${countWarn}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">เตือนเหลือ ≤ 5 วัน</small>
          </div>
        </div>
      </div>
    `;
    updateKpiActiveState();
  }

  let currentPage = 1;
  let pageSize = 5;

  function changePage(page) {
    currentPage = page;
    renderTable();
  }

  function changePageSize(size) {
    pageSize = parseInt(size, 10);
    currentPage = 1;
    renderTable();
  }

  function renderPaginationControls(totalItems) {
    const totalPages = Math.ceil(totalItems / pageSize) || 1;
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const paginationUl = document.getElementById("paginationControls");
    if (!paginationUl) return;

    if (totalItems === 0 || totalPages <= 1) {
      paginationUl.innerHTML = "";
      return;
    }

    let html = "";

    // Prev Button
    html += `
      <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
        <a class="page-link py-1 px-2" href="#" onclick="event.preventDefault(); ${currentPage > 1 ? `changePage(${currentPage - 1})` : ''}" aria-label="Previous">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
      </li>
    `;

    // Page Numbers
    for (let i = 1; i <= totalPages; i++) {
      html += `
        <li class="page-item ${i === currentPage ? 'active' : ''}">
          <a class="page-link py-1 px-2" href="#" onclick="event.preventDefault(); changePage(${i});">${i}</a>
        </li>
      `;
    }

    // Next Button
    html += `
      <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
        <a class="page-link py-1 px-2" href="#" onclick="event.preventDefault(); ${currentPage < totalPages ? `changePage(${currentPage + 1})` : ''}" aria-label="Next">
          <i class="fa-solid fa-chevron-right"></i>
        </a>
      </li>
    `;

    paginationUl.innerHTML = html;
  }

  function filterByKpi(type) {
    currentPage = 1;
    const catSelect = document.getElementById("categoryFilter");
    const slaSelect = document.getElementById("slaFilter");

    if (type === 'all' || activeKpiFilter === type) {
      activeKpiFilter = 'all';
      catSelect.value = 'all';
      slaSelect.value = 'all';
    } else {
      if (type === '10.1') {
        catSelect.value = '10.1';
        slaSelect.value = 'all';
      } else if (type === '10.2') {
        catSelect.value = '10.2';
        slaSelect.value = 'all';
      } else if (type === '10.3') {
        catSelect.value = '10.3';
        slaSelect.value = 'all';
      } else if (type === 'danger') {
        catSelect.value = 'all';
        slaSelect.value = 'danger';
      }
    }
    renderTable();
  }

  function updateKpiActiveState() {
    const cat = document.getElementById("categoryFilter") ? document.getElementById("categoryFilter").value : 'all';
    const sla = document.getElementById("slaFilter") ? document.getElementById("slaFilter").value : 'all';

    let currentActive = null;
    if (cat === 'all' && sla === 'all') currentActive = 'all';
    else if (cat === '10.1' && sla === 'all') currentActive = '10.1';
    else if (cat === '10.2' && sla === 'all') currentActive = '10.2';
    else if (cat === '10.3' && sla === 'all') currentActive = '10.3';
    else if (cat === 'all' && sla === 'danger') currentActive = 'danger';

    activeKpiFilter = currentActive;

    document.querySelectorAll(".kpi-card-interactive").forEach(card => {
      if (card.dataset.kpi === activeKpiFilter) {
        card.classList.add("active-kpi-filter");
      } else {
        card.classList.remove("active-kpi-filter");
      }
    });
  }

  function clearFilters() {
    currentPage = 1;
    document.getElementById("searchInput").value = "";
    document.getElementById("categoryFilter").value = "all";
    document.getElementById("slaFilter").value = "all";
    renderTable();
  }

  function renderTable() {
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const cat = document.getElementById("categoryFilter").value;
    const sla = document.getElementById("slaFilter").value;

    updateKpiActiveState();

    let cases = Activity10.getCases();

    cases = cases.filter(c => {
      const matchQ = !q || c.id.toLowerCase().includes(q) || c.title.toLowerCase().includes(q) || c.officer.toLowerCase().includes(q);
      const matchCat = (cat === 'all') || (c.category === cat) || (cat === '10.2' && c.category.startsWith('10.2'));
      let matchSla = true;
      if (sla === 'normal') matchSla = c.slaDaysRemaining > 15;
      if (sla === 'warning') matchSla = c.slaDaysRemaining <= 15 && c.slaDaysRemaining > 5;
      if (sla === 'danger') matchSla = c.slaDaysRemaining <= 5;

      return matchQ && matchCat && matchSla;
    });

    const tbody = document.getElementById("caseTableBody");
    document.getElementById("caseCountBadge").innerText = `${cases.length} เรื่อง`;

    if (cases.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted"><i class="fa-solid fa-inbox fs-2 mb-2 d-block"></i>ไม่พบรายการสำนวนตามเงื่อนไขที่เลือก</td></tr>`;
      renderPaginationControls(0);
      updateBulkUI();
      return;
    }

    const totalPages = Math.ceil(cases.length / pageSize) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    renderPaginationControls(cases.length);

    const startIndex = (currentPage - 1) * pageSize;
    const paginatedCases = cases.slice(startIndex, startIndex + pageSize);

    let html = "";
    paginatedCases.forEach(c => {
      const isUrgent = c.slaDaysRemaining <= 5;
      const slaBadgeClass = isUrgent ? 'st-urgent' : (c.slaDaysRemaining <= 15 ? 'st-review' : 'st-regular');

      html += `
        <tr>
          <td><input type="checkbox" class="form-check-input case-chk" value="${c.id}" onchange="updateBulkUI()"></td>
          <td><strong class="text-navy">${c.id}</strong><br><small class="text-muted">${c.docNo || ''}</small></td>
          <td><span class="st st-regular">${c.categoryName}</span></td>
          <td>
            <div class="fw-bold text-dark">${c.title}</div>
            <small class="text-muted"><i class="fa-solid fa-user me-1"></i>${c.officer}</small>
          </td>
          <td><span class="st ${c.statusBadge}">${c.status}</span></td>
          <td><span class="st ${slaBadgeClass}"><i class="fa-solid fa-clock me-1"></i>เหลือ ${c.slaDaysRemaining} วัน</span></td>
          <td class="text-end">
            <div class="btn-group btn-group-sm">
              <button type="button" onclick="openDraftModal('${c.id}')" class="btn btn-xs btn-navy" title="ยกร่างความเห็น (Split-Screen)"><i class="fa-solid fa-columns me-1"></i>ยกร่าง</button>
              <button type="button" onclick="openApprovalModal('${c.id}')" class="btn btn-xs btn-outline-primary" title="เสนออนุมัติ"><i class="fa-solid fa-paper-plane"></i></button>
              <button type="button" onclick="openSignModal('${c.id}')" class="btn btn-xs btn-outline-success" title="ลงนาม e-Signature"><i class="fa-solid fa-file-signature"></i></button>
            </div>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
    updateBulkUI();
  }

  function toggleSelectAll(masterChk) {
    const chks = document.querySelectorAll('.case-chk');
    chks.forEach(c => c.checked = masterChk.checked);
    updateBulkUI();
  }

  function getSelectedCaseIds() {
    const chks = document.querySelectorAll('.case-chk:checked');
    return Array.from(chks).map(c => c.value);
  }

  function updateBulkUI() {
    const selectedIds = getSelectedCaseIds();
    const countSpan = document.getElementById("bulkSelectCount");
    const bulkBtns = document.getElementById("bulkButtons");
    
    countSpan.innerText = `เลือกแล้ว ${selectedIds.length} รายการ`;
    if (selectedIds.length > 0) {
      bulkBtns.classList.remove("d-none");
    } else {
      bulkBtns.classList.add("d-none");
      const masterChk = document.getElementById("chkSelectAll");
      if (masterChk) masterChk.checked = false;
    }
  }

  function executeBulkApprove() {
    const selectedIds = getSelectedCaseIds();
    if (selectedIds.length === 0) return;

    Swal.fire({
      icon: 'question',
      title: `อนุมัติเสนอผู้บังคับบัญชา (${selectedIds.length} รายการ)?`,
      html: `<div class="text-start small">
        <p class="mb-2">รายการสำนวนคดีที่จะส่งเสนออนุมัติเป็นชุด:</p>
        <ul class="mb-3 text-navy fw-bold">${selectedIds.map(id => `<li>${id}</li>`).join('')}</ul>
        <small class="text-muted">สถานะของทุกรายการจะถูกอัปเดตเป็น <strong>"เสนอ ผอ.กองกฎหมาย / เลขาธิการ ป.ป.ท."</strong> พร้อมกัน</small>
      </div>`,
      showCancelButton: true,
      confirmButtonText: `ยืนยันอนุมัติ ${selectedIds.length} รายการ`,
      confirmButtonColor: '#0F2A62',
      cancelButtonText: 'ยกเลิก'
    }).then(res => {
      if (res.isConfirmed) {
        Activity10.bulkUpdateStatus(selectedIds, "PENDING_DIRECTOR", "เสนอ ผอ.กองกฎหมาย", "bg-primary text-white", "dir_legal");
        renderKPI();
        renderTable();
        Swal.fire({
          icon: 'success',
          title: 'อนุมัติและเสนอเรื่องเป็นชุดสำเร็จ!',
          text: `อัปเดตสถานะทั้ง ${selectedIds.length} รายการเรียบร้อยแล้ว`,
          timer: 1500,
          showConfirmButton: false
        });
      }
    });
  }

  function executeBulkReassign() {
    const selectedIds = getSelectedCaseIds();
    if (selectedIds.length === 0) return;

    Swal.fire({
      title: `มอบหมายนิติกรใหม่ (${selectedIds.length} รายการ)`,
      input: 'select',
      inputOptions: {
        'นายณัฐพล บัวทุม (นิติกรชำนาญการพิเศษ)': 'นายณัฐพล บัวทุม (นิติกรชำนาญการพิเศษ)',
        'นายปติคุณ อู่ตะเภา (นิติกรชำนาญการ)': 'นายปติคุณ อู่ตะเภา (นิติกรชำนาญการ)',
        'นางสาวนิติพร มีไพฑูรย์ (นิติกรชำนาญการ)': 'นางสาวนิติพร มีไพฑูรย์ (นิติกรชำนาญการ)',
        'นายอานนท์ ชนประชา (นิติกรชำนาญการพิเศษ)': 'นายอานนท์ ชนประชา (นิติกรชำนาญการพิเศษ)'
      },
      inputPlaceholder: 'เลือกนิติกรเจ้าของสำนวน...',
      showCancelButton: true,
      confirmButtonText: 'ยืนยันมอบหมาย',
      confirmButtonColor: '#0F2A62'
    }).then(res => {
      if (res.isConfirmed && res.value) {
        Activity10.bulkAssignOfficer(selectedIds, res.value);
        renderTable();
        Swal.fire({
          icon: 'success',
          title: 'มอบหมายงานสำเร็จ!',
          text: `มอบหมาย ${selectedIds.length} รายการให้ ${res.value} เรียบร้อยแล้ว`,
          timer: 1500,
          showConfirmButton: false
        });
      }
    });
  }

  function executeBulkExport() {
    const selectedIds = getSelectedCaseIds();
    const cases = Activity10.getCases().filter(c => selectedIds.includes(c.id));
    
    let summaryHtml = `
      <div style="text-align:left; font-size:0.85rem;">
        <p><strong>รายงานสรุปรายการคดีที่เลือก (${cases.length} รายการ):</strong></p>
        <table class="table table-sm table-bordered">
          <thead><tr><th>เลขที่สำนวน</th><th>เรื่อง</th><th>นิติกร</th><th>กรอบเวลา</th></tr></thead>
          <tbody>
            ${cases.map(c => `<tr><td>${c.id}</td><td>${c.title.substring(0,30)}...</td><td>${c.officer.split(' ')[0]}</td><td>${c.slaDaysRemaining} วัน</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;

    Swal.fire({
      title: '📊 สรุปข้อมูลส่งออก (Bulk Export)',
      html: summaryHtml,
      confirmButtonText: 'ดาวน์โหลดไฟล์สรุป (Excel/PDF Simulation)',
      confirmButtonColor: '#0F2A62'
    }).then(() => {
      Swal.fire({ icon:'success', title:'ดาวน์โหลดไฟล์สำเร็จ!', timer:1000, showConfirmButton:false });
    });
  }

  function resetDemoData() {
    Swal.fire({
      title: 'คืนค่าข้อมูลตัวอย่าง?',
      text: 'รีเซ็ตข้อมูลคดีกลับสู่ค่าเริ่มต้นสำหรับสาธิต',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'ตกลงรีเซ็ต',
      confirmButtonColor: '#0F2A62'
    }).then(res => {
      if (res.isConfirmed) {
        Activity10.resetData();
        renderKPI();
        renderTable();
        Swal.fire({ icon:'success', title:'รีเซ็ตสำเร็จ', timer:1000, showConfirmButton:false });
      }
    });
  }

  function openNewCaseModal(){
    Swal.fire({
      title: 'ลงทะเบียนรับหนังสือ/สำนวนใหม่',
      html: `
        <div class="text-start small">
          <div class="mb-2">
            <label class="form-label fw-bold">หมวดหมู่งานกฎหมาย</label>
            <select id="swalCat" class="form-select form-select-sm">
              <option value="10.1">คดีชั้นอัยการ (ความเห็นแย้ง)</option>
              <option value="10.2.1">ขอเปิดเผยข้อมูลข่าวสาร</option>
              <option value="10.2.2">อุทธรณ์การไม่เปิดเผยข้อมูล</option>
              <option value="10.3">คดีปกครอง (ศาลปกครอง)</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label fw-bold">ชื่อเรื่อง / รายละเอียดสำนวน</label>
            <input type="text" id="swalTitle" class="form-control form-control-sm" placeholder="กรอกชื่อเรื่องคำร้องหรือสำนวนคดี">
          </div>
          <div class="mb-2">
            <label class="form-label fw-bold">หน่วยงานต้นทาง / ที่มา</label>
            <input type="text" id="swalSource" class="form-control form-control-sm" placeholder="เช่น สำนักงานอัยการพิเศษฯ หรือ ศาลปกครอง">
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'บันทึกการลงทะเบียน',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#0F2A62',
      preConfirm: () => {
        const title = document.getElementById('swalTitle').value.trim();
        if (!title) {
          Swal.showValidationMessage('กรุณากรอกชื่อเรื่องสำนวน');
          return false;
        }
        return {
          category: document.getElementById('swalCat').value,
          title: title,
          source: document.getElementById('swalSource').value || 'ศูนย์รับเรื่องร้องเรียน ป.ป.ท.'
        };
      }
    }).then(res => {
      if (res.isConfirmed && res.value) {
        const newCase = Activity10.addCase(res.value);
        renderKPI();
        renderTable();
        Swal.fire({
          icon: 'success',
          title: 'ลงทะเบียนสำเร็จ!',
          text: `สร้างเลขสำนวน ${newCase.id} เรียบร้อยแล้ว`,
          confirmButtonColor: '#0F2A62'
        });
      }
    });
  }

  function openDraftModal(caseId){
    const kase = Activity10.getCaseById(caseId);
    Swal.fire({
      title: `ยกร่างความเห็น — ${kase.id}`,
      html: `
        <div class="text-start small">
          <p><b>เรื่อง:</b> ${kase.title}</p>
          <p><b>สถานะปัจจุบัน:</b> <span class="badge bg-warning text-dark">${kase.status}</span></p>
          <div class="mb-2">
            <label class="form-label fw-bold">บันทึกความเห็นทางกฎหมาย (ยกร่าง)</label>
            <textarea id="swalOpinion" class="form-control form-control-sm" rows="4">${kase.legalOpinion || ''}</textarea>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'บันทึกร่างความเห็น',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#0F2A62'
    }).then(res => {
      if (res.isConfirmed) {
        const newOpinion = document.getElementById('swalOpinion').value.trim();
        kase.legalOpinion = newOpinion;
        Activity10.updateCaseStatus(kase.id, 'DRAFTING_OPINION', 'กำลังร่างความเห็นแย้ง', 'bg-warning text-dark');
        renderTable();
        Swal.fire({ icon:'success', title:'บันทึกร่างความเห็นสำเร็จ', timer:1200, showConfirmButton:false });
      }
    });
  }

  function openApprovalModal(caseId){
    const kase = Activity10.getCaseById(caseId);
    Swal.fire({
      title: `เสนอพิจารณาอนุมัติ — ${kase.id}`,
      html: `
        <div class="text-start small">
          <p><b>เรื่อง:</b> ${kase.title}</p>
          <p><b>ความเห็นทางกฎหมาย:</b> ${kase.legalOpinion || 'อยู่ระหว่างตรวจพิจารณา'}</p>
          <hr>
          <p class="fw-bold">เลือกผลการพิจารณา:</p>
        </div>
      `,
      showCancelButton: true,
      showDenyButton: true,
      confirmButtonText: 'อนุมัติ / เห็นชอบ',
      denyButtonText: 'ส่งกลับแก้ไข',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#0F2A62',
      denyButtonColor: '#a5322a'
    }).then(res => {
      if (res.isConfirmed) {
        Activity10.updateCaseStatus(kase.id, 'PENDING_DIRECTOR', 'เสนอ ผอ.กองกฎหมาย', 'bg-primary text-white');
        renderKPI();
        renderTable();
        Swal.fire({ icon:'success', title:'เสนอพิจารณาอนุมัติสำเร็จ!', timer:1200, showConfirmButton:false });
      } else if (res.isDenied) {
        Activity10.updateCaseStatus(kase.id, 'DRAFTING_OPINION', 'ส่งกลับแก้ไขร่างความเห็น', 'bg-secondary text-white');
        renderKPI();
        renderTable();
        Swal.fire({ icon:'info', title:'ส่งเรื่องกลับแก้ไขแล้ว', timer:1200, showConfirmButton:false });
      }
    });
  }

  function openSignModal(caseId){
    const kase = Activity10.getCaseById(caseId);
    Swal.fire({
      title: `ลงนาม e-Signature — ${kase.id}`,
      html: `
        <div class="text-start small">
          <p><b>เรื่อง:</b> ${kase.title}</p>
          <p><b>ผู้ลงนาม:</b> นายอภิชาติ สุจริตกุล (เลขาธิการ ป.ป.ท.)</p>
          <div class="p-3 bg-light border rounded text-center my-2">
            <i class="fa-solid fa-signature fa-2x text-navy mb-2"></i>
            <div><small class="font-monospace text-muted">DIGITAL SIGNATURE STAMP</small></div>
            <b>[ลงนามกำกับด้วยใบรับรองอิเล็กทรอนิกส์ PKI]</b>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'ยืนยันลงนามดิจิทัล',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#198754'
    }).then(res => {
      if (res.isConfirmed) {
        kase.signatureStamped = true;
        kase.signedBy = 'นายอภิชาติ สุจริตกุล (เลขาธิการ ป.ป.ท.)';
        kase.signedDate = new Date().toLocaleString('th-TH');
        Activity10.updateCaseStatus(kase.id, 'PENDING_SECGEN', 'ลงนามเรียบร้อยแล้ว', 'bg-success text-white');
        renderKPI();
        renderTable();
        Swal.fire({ icon:'success', title:'ลงนามดิจิทัลสำเร็จ!', timer:1200, showConfirmButton:false });
      }
    });
  }
</script>
</body>
</html>
