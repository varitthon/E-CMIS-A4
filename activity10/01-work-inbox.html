<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คิวงานหลัก | E-CMIS ระบบกฎหมายในทางคดี</title>
<link rel="icon" type="image/png" href="pacc_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

<link href="assets/ecmis-activity10.css" rel="stylesheet">
</head>
<body>

<main class="app-main">

  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-inbox me-2"></i>รายการสำนวนคดี</h1>
    </div>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <button class="btn btn-xs btn-outline-secondary" onclick="resetDemoData()"><i class="fa-solid fa-rotate me-1"></i>รีเซ็ต</button>
      <a href="02-board-intake.html" class="btn btn-dark btn-sm" id="btnBoardIntake"><i class="fa-solid fa-file-signature me-1"></i>รับเรื่องเข้าระบบ</a>
    </div>
  </div>

  <!-- KPI Row -->
  <div class="row g-3 mb-4" id="kpiContainer">
    <!-- Rendered dynamically -->
  </div>

  <!-- Filter & Search Controls -->
  <div class="card card-ecmis mb-3">
    <div class="card-body p-3">
      <div class="row g-2 align-items-center">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="ค้นหาเลขสำนวน / เลขรับกองกฎหมาย / ชื่อผู้กล่าวหา / ชื่อผู้ถูกกล่าวหา / นิติกร..." onkeyup="currentPage = 1; renderTable()">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="categoryFilter" title="ประเภทคดี" aria-label="ประเภทคดี" onchange="renderTable()">
            <option value="all">ทั้งหมด</option>
            <option value="10.1">คดีอาญาทุจริตและคดีประพฤติมิชอบ</option>
            <option value="10.2.1">การขอเปิดเผยข้อมูลข่าวสาร</option>
            <option value="10.3">คดีศาลปกครอง</option>
          </select>
        </div>
        <div class="col-md-3 text-end d-flex align-items-center justify-content-end gap-2">
          <button type="button" class="btn btn-xs btn-outline-secondary py-1 px-2" onclick="clearFilters()" title="ล้างตัวกรองทั้งหมด">
            <i class="fa-solid fa-filter-circle-xmark me-1"></i>ล้างกรอง
          </button>
          <span class="badge bg-secondary text-white px-3 py-2 fs-6 rounded-pill" id="caseCountBadge">0 เรื่อง</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Table Work Queue -->
  <div class="row g-3">
    <div class="col-12">
      <div class="card card-ecmis mb-3">
        <div class="card-header d-flex align-items-center justify-content-between">
          <span>รายการงานกฎหมายและสำนวนคดี</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover tbl-ecmis mb-0">
              <colgroup>
                <col style="width:105px">
                <col style="width:115px">
                <col style="width:130px">
                <col>
                <col style="width:140px">
                <col style="width:140px">
                <col style="width:125px">
                <col style="width:125px">
                <col style="width:105px">
              </colgroup>
              <thead>
                <tr>
                  <th>เลขสำนวน</th>
                  <th>เลขรับกกม.</th>
                  <th>ประเภทสำนวน</th>
                  <th>ชื่อเรื่อง</th>
                  <th>ชื่อผู้กล่าวหา</th>
                  <th>ชื่อผู้ถูกกล่าวหา</th>
                  <th>สถานะ</th>
                  <th>อายุความ/SLA</th>
                  <th class="text-end">ดำเนินการ</th>
                </tr>
              </thead>
              <tbody id="caseTableBody">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
          
          <!-- Pagination footer -->
          <div class="px-3 py-2 border-top bg-light d-flex align-items-center justify-content-between flex-wrap gap-3" id="tableFooter">
            <div></div>
            <!-- Pagination Controls -->
            <div class="ms-auto" id="paginationWrapper">
              <nav aria-label="Table navigation">
                <ul class="pagination pagination-sm mb-0" id="paginationControls">
                  <!-- Rendered dynamically -->
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/ecmis-app.js?v=20260820_2"></script>
<script src="assets/ecmis-activity10.js?v=20260822_1"></script>
<script>
  ECMIS.renderShell('01-work-inbox.html');

  document.addEventListener("DOMContentLoaded", function() {
    checkRolePermissions();
    renderKPI();
    renderTable();
  });

  function checkRolePermissions() {
    const roleId = ECMIS.currentRoleId();
    const btnIntake = document.getElementById("btnBoardIntake");
    if (btnIntake) {
      if (roleId === 'admin_legal' || roleId === 'Kanda.R') {
        btnIntake.style.display = 'inline-flex';
      } else {
        btnIntake.style.display = 'none';
      }
    }
  }

  let activeKpiFilter = null;

  function getCasesForCurrentRole() {
    const roleId = ECMIS.currentRoleId();
    const cases = Activity10.getCases();

    // 1. เจ้าหน้าที่ธุรการกองกฎหมาย (admin_legal / Kanda.R)
    // เห็นสำนวนทั้งหมดในระบบ โดยงานที่ออกเลขรับและส่งเสนอ ผอ.กม. ไปแล้ว จะแสดงปุ่มสำหรับกดดู (View-only)
    if (roleId === 'admin_legal' || roleId === 'Kanda.R') {
      return cases;
    }

    // 2. ผู้อำนวยการกองกฎหมาย (dir_legal / Napas.S)
    // เห็นเฉพาะงานที่รอ ผอ.กม. พิจารณา/สั่งการ:
    // - ธุรการออกเลขรับแล้ว ส่งเสนอ ผอ.กม. พิจารณามอบหมายกลุ่มงาน (PENDING_DIRECTOR)
    // - ผอ.กลุ่มงาน ตรวจร่างความเห็นแล้ว ส่งเสนอ ผอ.กม. ตรวจพิจารณา (PENDING_DIRECTOR_APPROVAL)
    // - ธุรการส่งต่อหนังสือผลมติมาให้ ผอ.กม. สั่งการ (PENDING_DIRECTOR_RESOLUTION / เสนอผลมติ ผอ.กองกฎหมาย)
    if (roleId === 'dir_legal' || roleId === 'Napas.S') {
      return cases.filter(c => {
        return c.statusCode === 'PENDING_DIRECTOR' || 
               c.statusCode === 'PENDING_DIRECTOR_APPROVAL' || 
               c.statusCode === 'PENDING_DIRECTOR_RESOLUTION' || 
               c.statusCode === 'COMPLETED' ||
               c.status === 'ผอ.กองกฎหมายพิจารณา' ||
               c.status === 'ผอ.กองกฎหมายพิจารณาผลมติ' ||
               c.status === 'ผอ.กองกฎหมายสั่งการตามมติแล้ว' ||
               c.status === 'พิจารณาความเห็นของนิติกร' ||
               c.status === 'เสนอผลมติ ผอ.กองกฎหมาย' ||
               c.status === 'เสนอ ผอ.กองกฎหมาย ตรวจพิจารณา' || 
               (c.status && c.status.includes('ผอ.กองกฎหมาย') && c.lawReceiveNo);
      });
    }

    // 3. ผู้อำนวยการกลุ่มงานความเห็นแย้ง (group_director / Arnon.C)
    // เห็นเฉพาะงานที่รอกลุ่มงานดำเนินการ:
    // - ผอ.กม. มอบหมายเรื่องมาให้กลุ่มงาน เพื่อมอบหมายนิติกร (PENDING_GROUP_DIRECTOR)
    // - นิติกร ทำความเห็นเสร็จแล้ว ส่งเสนอ ผอ.กลุ่มงาน ตรวจร่าง (PENDING_GROUP_REVIEW)
    if (roleId === 'group_director' || roleId === 'Arnon.C') {
      return cases.filter(c => {
        return c.statusCode === 'PENDING_GROUP_DIRECTOR' || 
               c.statusCode === 'PENDING_GROUP_REVIEW' || 
               c.status === 'ผอ.กลุ่มงานความเห็นแย้งพิจารณา' ||
               c.status === 'ผอ.กลุ่มงานความเห็นแย้งพิจารณาผลมติ' ||
               c.status === 'พิจารณาความเห็นของนิติกร' ||
               c.status === 'รอ ผอ.กลุ่มงานความเห็นแย้ง มอบหมายนิติกร' ||
               c.status === 'มอบหมายกลุ่มงานความเห็นแย้ง' || 
               c.status === 'เสนอ ผอ.กลุ่มงาน ตรวจร่างความเห็น';
      });
    }

    // 4. นิติกรเจ้าของสำนวน (legal_officer / Nattapol.B)
    // เห็นเฉพาะงานที่นิติกรได้รับมอบหมายให้จัดทำความเห็น:
    // - DRAFTING_OPINION หรือ assignedRole === 'legal_officer'
    if (roleId === 'legal_officer' || roleId === 'Nattapol.B') {
      return cases.filter(c => {
        return c.statusCode === 'DRAFTING_OPINION' || 
               c.status === 'นิติกรจัดทำความเห็น' ||
               c.status === 'นิติกรกำลังจัดทำความเห็น' ||
               (c.assignedRole === 'legal_officer' && c.statusCode !== 'PENDING_GROUP_REVIEW' && c.statusCode !== 'PENDING_DIRECTOR_APPROVAL' && c.statusCode !== 'PENDING_DISPATCH' && c.statusCode !== 'PENDING_DEPUTY_SG' && c.statusCode !== 'RETURNED_FROM_EXEC' && c.statusCode !== 'COMPLETED');
      });
    }

    // 5. รองเลขาธิการ ป.ป.ท. (deputy_sg / Surapong.W)
    // เห็นเฉพาะงานที่ส่งเสนอผู้บริหารตรวจสอบ:
    // - PENDING_DEPUTY_SG
    if (roleId === 'deputy_sg' || roleId === 'Surapong.W') {
      return cases.filter(c => {
        return c.statusCode === 'PENDING_DEPUTY_SG' || c.status === 'รอ รองเลขาธิการ ป.ป.ท. ตรวจสอบ';
      });
    }

    return cases;
  }

  function renderKPI() {
    const cases = getCasesForCurrentRole();
    const countTotal = cases.length;
    const count101 = cases.filter(c => c.category === '10.1').length;
    const count102 = cases.filter(c => c.category.startsWith('10.2')).length;
    const count103 = cases.filter(c => c.category === '10.3').length;

    document.getElementById("kpiContainer").innerHTML = `
      <div class="col-6 col-md-3">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive bg-white border" style="min-height:92px;" data-kpi="all" onclick="filterByKpi('all')" title="คลิกเพื่อดูกล่องทั้งหมด">
          <div class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-dark" style="line-height:1.1">${countTotal}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">งานทั้งหมด</small>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive bg-white border" style="min-height:92px;" data-kpi="10.1" onclick="filterByKpi('10.1')" title="คลิกเพื่อกรองคดีศาลอาญาทุจริตและประพฤติมิชอบ">
          <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-scale-balanced"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-primary" style="line-height:1.1">${count101}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">คดีศาลอาญาทุจริตและประพฤติมิชอบ</small>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive bg-white border" style="min-height:92px;" data-kpi="10.2" onclick="filterByKpi('10.2')" title="คลิกเพื่อกรองคำร้องขอเปิดเผยข้อมูล">
          <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-envelope-open-text"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-warning" style="line-height:1.1">${count102}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">คำร้องขอเปิดเผยข้อมูล</small>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-ecmis h-100 p-3 d-flex flex-row align-items-center gap-3 kpi-card-interactive bg-white border" style="min-height:92px;" data-kpi="10.3" onclick="filterByKpi('10.3')" title="คลิกเพื่อกรองคดีศาลปกครอง">
          <div class="rounded-circle bg-info text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width:44px;height:44px;font-size:1.3rem;">
            <i class="fa-solid fa-landmark"></i>
          </div>
          <div style="min-width:0">
            <h3 class="m-0 fw-bold text-info" style="line-height:1.1">${count103}</h3>
            <small class="text-muted fw-semibold d-block mt-1" style="font-size:0.76rem;line-height:1.2">คดีศาลปกครอง</small>
          </div>
        </div>
      </div>
    `;

    updateKpiActiveState();
  }

  let currentPage = 1;
  let pageSize = 5;

  function changePage(page) {
    currentPage = page;
    renderTable();
  }

  function changePageSize(size) {
    pageSize = parseInt(size, 10);
    currentPage = 1;
    renderTable();
  }

  function renderPaginationControls(totalItems) {
    const totalPages = Math.ceil(totalItems / pageSize) || 1;
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const paginationUl = document.getElementById("paginationControls");
    if (!paginationUl) return;

    if (totalItems === 0 || totalPages <= 1) {
      paginationUl.innerHTML = "";
      return;
    }

    let html = "";

    // Prev Button
    html += `
      <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
        <a class="page-link py-1 px-2" href="#" onclick="event.preventDefault(); ${currentPage > 1 ? `changePage(${currentPage - 1})` : ''}" aria-label="Previous">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
      </li>
    `;

    // Page Numbers
    for (let i = 1; i <= totalPages; i++) {
      html += `
        <li class="page-item ${i === currentPage ? 'active' : ''}">
          <a class="page-link py-1 px-2" href="#" onclick="event.preventDefault(); changePage(${i});">${i}</a>
        </li>
      `;
    }

    // Next Button
    html += `
      <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
        <a class="page-link py-1 px-2" href="#" onclick="event.preventDefault(); ${currentPage < totalPages ? `changePage(${currentPage + 1})` : ''}" aria-label="Next">
          <i class="fa-solid fa-chevron-right"></i>
        </a>
      </li>
    `;

    paginationUl.innerHTML = html;
  }

  function filterByKpi(type) {
    currentPage = 1;
    const catSelect = document.getElementById("categoryFilter");

    if (type === 'all' || activeKpiFilter === type) {
      activeKpiFilter = 'all';
      if (catSelect) catSelect.value = 'all';
    } else {
      if (type === '10.1') {
        if (catSelect) catSelect.value = '10.1';
      } else if (type === '10.2' || type === '10.2.1') {
        if (catSelect) catSelect.value = '10.2.1';
      } else if (type === '10.3') {
        if (catSelect) catSelect.value = '10.3';
      }
    }
    renderTable();
  }

  function updateKpiActiveState() {
    const cat = document.getElementById("categoryFilter") ? document.getElementById("categoryFilter").value : 'all';

    let currentActive = null;
    if (cat === 'all') currentActive = 'all';
    else if (cat === '10.1') currentActive = '10.1';
    else if (cat === '10.2.1' || cat === '10.2') currentActive = '10.2';
    else if (cat === '10.3') currentActive = '10.3';

    activeKpiFilter = currentActive;

    document.querySelectorAll(".kpi-card-interactive").forEach(card => {
      if (card.dataset.kpi === activeKpiFilter) {
        card.classList.add("active-kpi-filter");
      } else {
        card.classList.remove("active-kpi-filter");
      }
    });
  }

  function clearFilters() {
    activeKpiFilter = null;
    currentPage = 1;
    document.getElementById("searchInput").value = "";
    if (document.getElementById("categoryFilter")) document.getElementById("categoryFilter").value = "all";
    renderTable();
  }

  function getActionButtonHtml(c, roleId) {
    // 1. ธุรการกองกฎหมาย (ลงรับเรื่องและออกเลขรับแล้ว -> กดดูรายละเอียดสำนวนและเอกสารอัยการ)
    if (roleId === 'admin_legal' || roleId === 'Kanda.R') {
      if (c.statusCode === 'PENDING_DISPATCH' || c.status === 'ธุรการออกเลขส่งภายใน' || c.status === 'ส่งเรื่องให้ธุรการกองกฎหมายดำเนินการ') {
        return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-dark px-2 fw-semibold" title="ดำเนินการ"><i class="fa-solid fa-paper-plane me-1"></i>ดำเนินการ</button>`;
      }
      if (c.statusCode === 'RETURNED_FROM_EXEC' || c.statusCode === 'PENDING_FINAL_DISPATCH' || c.status === 'ธุรการรับผลมติ' || (c.status && (c.status.includes('ธุรการรับผลมติ') || c.status.includes('ธุรการับผลมติ') || c.status.includes('ผู้บริหารลงนามแล้ว') || c.status.includes('รับเรื่องคืน')))) {
        return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-dark px-2 fw-semibold" title="ดำเนินการ"><i class="fa-solid fa-arrow-right me-1"></i>ดำเนินการ</button>`;
      }
      return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-outline-secondary text-dark" title="ดูรายละเอียดสำนวน"><i class="fa-solid fa-eye text-dark"></i></button>`;
    }

    // 2. ผอ.กองกฎหมาย
    if (roleId === 'dir_legal' || roleId === 'Napas.S') {
      if (c.statusCode === 'PENDING_DIRECTOR' || c.statusCode === 'PENDING_DIRECTOR_APPROVAL' || c.statusCode === 'PENDING_DIRECTOR_RESOLUTION' || (c.status && (c.status.includes('ผอ.กองกฎหมาย') || c.status.includes('เสนอผลมติ') || c.status.includes('พิจารณาความเห็น')))) {
        return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-dark px-2 fw-semibold" title="ดำเนินการ"><i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ</button>`;
      }
      return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-outline-secondary text-dark" title="ดูรายละเอียดสำนวน"><i class="fa-solid fa-eye text-dark"></i></button>`;
    }

    // 3. ผอ.กลุ่มงานความเห็นแย้ง
    if (roleId === 'group_director' || roleId === 'Arnon.C') {
      if (c.statusCode === 'PENDING_GROUP_DIRECTOR') {
        return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-dark px-2 fw-semibold" title="ดำเนินการ"><i class="fa-solid fa-user-plus me-1"></i>ดำเนินการ</button>`;
      } else if (c.statusCode === 'PENDING_GROUP_REVIEW') {
        return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-dark px-2 fw-semibold" title="ดำเนินการ"><i class="fa-solid fa-clipboard-check me-1"></i>ดำเนินการ</button>`;
      } else if (c.statusCode === 'PENDING_GROUP_RESOLUTION' || c.status === 'ผอ.กลุ่มงานความเห็นแย้งพิจารณาผลมติ' || (c.status && c.status.includes('ผอ.กลุ่มงาน') && c.status.includes('ผลมติ'))) {
        return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-dark px-2 fw-semibold" title="ดำเนินการ"><i class="fa-solid fa-user-gear me-1"></i>ดำเนินการ</button>`;
      }
      return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-outline-secondary text-dark" title="ดูรายละเอียดสำนวน"><i class="fa-solid fa-eye text-dark"></i></button>`;
    }

    // 4. นิติกร
    if (roleId === 'legal_officer' || roleId === 'Nattapol.B') {
      if (c.statusCode === 'DRAFTING_OPINION' || (c.assignedRole === 'legal_officer' && c.statusCode !== 'PENDING_GROUP_REVIEW' && c.statusCode !== 'PENDING_DIRECTOR_APPROVAL')) {
        return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-dark px-2 fw-semibold" title="ดำเนินการ"><i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ</button>`;
      }
      return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-outline-secondary text-dark" title="ดูรายละเอียดสำนวน"><i class="fa-solid fa-eye text-dark"></i></button>`;
    }

    return `<button type="button" onclick="openProsecutorDocModal('${c.id}')" class="btn btn-xs btn-outline-secondary text-dark" title="ดูรายละเอียดสำนวน"><i class="fa-solid fa-eye text-dark"></i></button>`;
  }

  function renderTable() {
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const cat = document.getElementById("categoryFilter") ? document.getElementById("categoryFilter").value : 'all';

    updateKpiActiveState();

    let cases = getCasesForCurrentRole();

    cases = cases.filter(c => {
      const tor = (typeof Activity10 !== 'undefined' && Activity10.getTorDetails) ? Activity10.getTorDetails(c) : {};
      const caseId = (c.id || '').toLowerCase();
      const cleanId = caseId.replace(/^.*?-/, '');
      const paccCaseNo = (c.paccCaseNo || (tor && tor.paccCaseNo) || '').toLowerCase();
      const investigationNo = (c.investigationNo || '').toLowerCase();
      const lawReceiveNo = (c.lawReceiveNo || '').toLowerCase();
      const title = (c.title || '').toLowerCase();
      const officer = (c.officer || '').toLowerCase();
      const accuser = (c.accuser || (tor && tor.accuser) || '').toLowerCase();
      const accused = (c.accused || (tor && tor.accused) || '').toLowerCase();
      const docNo = (c.docNo || '').toLowerCase();
      const centralSarabanNo = (c.centralSarabanNo || '').toLowerCase();

      const matchQ = !q || 
        caseId.includes(q) || 
        cleanId.includes(q) || 
        paccCaseNo.includes(q) || 
        investigationNo.includes(q) || 
        lawReceiveNo.includes(q) || 
        title.includes(q) || 
        officer.includes(q) || 
        accuser.includes(q) || 
        accused.includes(q) || 
        docNo.includes(q) || 
        centralSarabanNo.includes(q);

      const days = (typeof Activity10 !== 'undefined' && Activity10.calculateDaysRemaining)
        ? Activity10.calculateDaysRemaining(c)
        : (typeof c.slaDaysRemaining === 'number' ? c.slaDaysRemaining : 15);

      const matchCat = (cat === 'all') || (c.category === cat) || (cat === '10.2.1' && (c.category === '10.2.1' || c.category.startsWith('10.2')));

      return matchQ && matchCat;
    });

    const tbody = document.getElementById("caseTableBody");
    document.getElementById("caseCountBadge").innerText = `${cases.length} เรื่อง`;

    if (cases.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" class="text-center py-5 text-muted">
            <div class="py-4">
              <i class="fa-solid fa-circle-check text-success opacity-50 mb-3" style="font-size: 3rem;"></i>
              <div class="fs-5 fw-bold text-dark mb-1">ไม่มีรายการงานค้างที่รอดำเนินการ</div>
              <p class="text-muted small mb-0">ขณะนี้ไม่มีสำนวนคดีที่รอให้บทบาทของคุณดำเนินการในระบบ</p>
            </div>
          </td>
        </tr>
      `;
      renderPaginationControls(0);
      return;
    }

    const totalPages = Math.ceil(cases.length / pageSize) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    renderPaginationControls(cases.length);

    const startIndex = (currentPage - 1) * pageSize;
    const paginatedCases = cases.slice(startIndex, startIndex + pageSize);

    const currentRole = ECMIS.currentRoleId();

    let html = "";
    paginatedCases.forEach(c => {
      const days = (typeof Activity10 !== 'undefined' && Activity10.calculateDaysRemaining)
        ? Activity10.calculateDaysRemaining(c)
        : (typeof c.slaDaysRemaining === 'number' ? c.slaDaysRemaining : 15);
      const isUrgent = days <= 7;
      const actionButtonHtml = getActionButtonHtml(c, currentRole);
      const tor = (typeof Activity10 !== 'undefined' && Activity10.getTorDetails) ? Activity10.getTorDetails(c) : {};
      const displayPaccNo = c.paccCaseNo || (tor && tor.paccCaseNo) || '';
      const displayAccuser = c.accuser || (tor && tor.accuser) || (tor && tor.complainant) || '';
      const displayAccused = c.accused || (tor && tor.accused) || (tor && tor.defendant) || '';
      const cleanAccuser = displayAccuser.replace(/\s*\([^)]*\)/g, '').trim();
      const cleanAccused = displayAccused.replace(/\s*\([^)]*\)/g, '').trim();

      // นับวัน และถ้าเวลาเหลือ <= 7 วัน ให้เปลี่ยนสีตัวอักษรเป็นสีแดง
      let slaHtml = '';
      if (days <= 0) {
        slaHtml = `<span class="text-danger fw-bold small"><i class="fa-solid fa-triangle-exclamation text-danger me-1"></i>เกินกำหนด ${Math.abs(days)} วัน</span>`;
      } else if (days <= 7) {
        slaHtml = `<span class="text-danger fw-bold small"><i class="fa-solid fa-clock text-danger me-1"></i>เหลือ ${days} วัน</span>`;
      } else if (days <= 15) {
        slaHtml = `<span class="text-warning-emphasis fw-semibold small"><i class="fa-solid fa-clock text-warning me-1"></i>เหลือ ${days} วัน</span>`;
      } else {
        slaHtml = `<span class="text-secondary small"><i class="fa-solid fa-clock me-1"></i>เหลือ ${days} วัน</span>`;
      }

      html += `
        <tr>
          <td>
            <strong class="text-dark font-monospace">${c.id.replace(/^.*?-/, '')}</strong>
          </td>
          <td>
            ${c.lawReceiveNo 
              ? `<div class="text-primary font-monospace fw-bold" style="font-size:0.82rem;"><i class="fa-solid fa-receipt me-1"></i>${c.lawReceiveNo}</div>` 
              : `<span class="text-muted small">- ยังไม่ออกเลข -</span>`}
          </td>
          <td><span class="text-dark small">${c.categoryName}</span></td>
          <td>
            <div class="fw-bold text-dark">${c.title}</div>
          </td>
          <td>
            ${cleanAccuser ? `<span class="text-dark fw-medium small">${cleanAccuser}</span>` : `<span class="text-muted small">-</span>`}
          </td>
          <td>
            ${cleanAccused ? `<span class="text-dark fw-medium small">${cleanAccused}</span>` : `<span class="text-muted small">-</span>`}
          </td>
          <td><span class="st ${c.statusBadge}">${c.status}</span></td>
          <td>${slaHtml}</td>
          <td class="text-end">
            ${actionButtonHtml}
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }
